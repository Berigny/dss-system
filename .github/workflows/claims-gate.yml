name: Claims Registry Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  claims-gate:
    name: Verify all benchmark claims are registered
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install benchmark dependencies
        run: make install

      - name: Validate claims registry
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path

          ROOT = Path('dss-benchmark-standalone')
          sys.path.insert(0, str(ROOT))

          from harness.runner import run_benchmarks
          from harness.claims_registry import load_registry, check_registry

          registry = load_registry(ROOT / 'eval' / 'claims_registry.yaml')

          if registry.get('unknown_claims_policy') != 'fail_ci':
              print("ERROR: unknown_claims_policy must be 'fail_ci'")
              sys.exit(1)

          report = run_benchmarks(
              adapter_name='faiss',
              seeds=[42],
              suites=['poisoning', 'integrity', 'abstention'],
              mock_embeddings=True,
          )

          overall, binding = check_registry(registry, report['suites'])

          print(f"Overall registry pass: {overall}")
          print(f"Bound claims: {len(binding['bound'])}")
          print(f"Unknown claims: {binding['unknown_claims']}")
          print(f"Missing claims: {binding['missing_claims']}")

          if binding['unknown_claims']:
              print("ERROR: unregistered claims detected:")
              for cid in binding['unknown_claims']:
                  print(f"  - {cid}")
              sys.exit(1)

          if binding['missing_claims']:
              print("ERROR: registered claims not produced by the benchmark:")
              for cid in binding['missing_claims']:
                  print(f"  - {cid}")
              sys.exit(1)

          if not overall:
              print("ERROR: registry check failed")
              sys.exit(1)

          print("OK: all benchmark claims are registered and pass their thresholds.")
          PY
